<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عالم البلايستيشن</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#080b1a;color:#fff}
.header{display:flex;justify-content:space-between;padding:16px;background:#0e1330;position:sticky;top:0}
.hero{text-align:center;padding:40px 20px}
.hero h1{font-size:30px} .hero h1 span{color:#2af5d2}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px}
.card{background:#151b3d;border:1px solid #2a3566;border-radius:16px;padding:20px;text-align:center}
.card h3{margin:8px 0} .card button{background:#2af5d2;border:0;padding:10px 16px;border-radius:10px;font-weight:800;width:100%;margin-top:10px}
.popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center;padding:20px;z-index:999}
.popup.show{display:flex}
.box{background:#1a2147;padding:24px;border-radius:18px;max-width:380px;width:100%;text-align:center;border:1px solid #2af5d2}
.box a{display:block;background:#25D366;color:#000;padding:12px;border-radius:10px;margin-top:14px;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<div class="header"><b style="color:#2af5d2">عالم البلايستيشن 🎮</b><span>امدرمان</span></div>
<div class="hero">
<h1>ألعابك الجاية <span>هنا</span></h1>
<p style="color:#8aa;margin-top:10px">دوس على أي لعبة عشان التفاصيل تفتح</p>
</div>
<div class="cards">
<div class="card"><h3>⚽ FIFA 25</h3><p>25,000 SDG</p><button onclick="openG('FIFA 25','لعبة كرة قدم آخر اصدار مع كل الفرق','25,000')">افتح التفاصيل</button></div>
<div class="card"><h3>🔫 GTA V</h3><p>18,000 SDG</p><button onclick="openG('GTA V','عالم مفتوح واكشن','18,000')">افتح التفاصيل</button></div>
<div class="card"><h3>🎮 PS5</h3><p>450,000 SDG</p><button onclick="openG('جهاز PS5','جهاز جديد كرتونة مقفلة','450,000')">افتح التفاصيل</button></div>
<div class="card"><h3>🕹️ يد PS4</h3><p>25,000 SDG</p><button onclick="openG('يد تحكم PS4','أصلية 100%','25,000')">افتح التفاصيل</button></div>
</div>
<div id="pop" class="popup" onclick="closeG()"><div class="box" onclick="event.stopPropagation()"><h2 id="t"></h2><p id="d" style="color:#8aa;margin:12px 0"></p><h3 id="p" style="color:#2af5d2"></h3><a id="w" href="#">اطلب عبر واتساب 🟢</a><p onclick="closeG()" style="margin-top:14px;color:#8aa;cursor:pointer">إغلاق</p></div></div>
<script>
function openG(t,d,p){document.getElementById('t').innerText=t;document.getElementById('d').innerText=d;document.getElementById('p').innerText=p+' SDG';document.getElementById('w').href='https://wa.me/249000000000?text=سلام داير اطلب '+t;document.getElementById('pop').classList.add('show')}
function closeG(){document.getElementById('pop').classList.remove('show')}
</script>
</body>
</html>
